<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบคลังโครงงาน - Google Drive Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    :root { --primary: #6a11cb; --secondary: #2575fc; --success: #00b894; --google-blue: #4285F4; }
    body { margin:0; font-family: 'Prompt', sans-serif; background:#f0f2f5; color: #333; }
    .page { display:none; padding:20px; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .center-box { width:350px; background:white; padding:25px; margin:80px auto; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,.2); text-align:center; }
    .form-box { width:100%; max-width:850px; margin:auto; background:white; padding:30px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
   
    input, select { width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #ddd; font-size: 16px; font-family: inherit; box-sizing: border-box; }
    button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:10px; font-size:16px; font-weight:600; color:white; cursor:pointer; transition: 0.2s; background: linear-gradient(135deg, var(--secondary), var(--primary)); }
    button:hover { opacity: 0.9; transform: translateY(-1px); }

    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .project-box { position:relative; border-radius:12px; padding:20px; background:#fff; border:1px solid #eee; transition: 0.3s; }
    .project-box:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .project-title { font-size:18px; font-weight:600; color:var(--primary); margin-bottom:12px; line-height: 1.4; }
   
    .tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-right: 5px; margin-bottom: 5px; background: #e8f0fe; color: #1a73e8; }
    .sub-title { font-size: 14px; color: #666; margin-bottom: 4px; }
    .delete-btn { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:#ff4d4f; color:white; border:none; cursor:pointer; }
   
    .drive-link-btn { background: var(--google-blue) !important; display: flex; align-items: center; justify-content: center; gap: 8px; }
</style>
</head>
<body>

<div id="page-login" class="page" style="display:block;">
    <div class="center-box">
        <h2>คลังโครงงานอิเล็กทรอนิกส์</h2>
        <input id="loginUser" placeholder="ชื่อผู้ใช้">
        <input id="loginPass" type="password" placeholder="รหัสผ่าน">
        <button onclick="login()">เข้าสู่ระบบ</button>
    </div>
</div>

<div id="page-choice" class="page">
    <div class="center-box">
        <h2 id="welcomeText">ยินดีต้อนรับ</h2>
        <button onclick="enterCreator()">จัดการโครงงานของฉัน</button>
        <button onclick="enterViewer()" style="background: var(--success);">ดูคลังโครงงานทั้งหมด</button>
        <button style="background: #636e72;" onclick="logout()">ออกจากระบบ</button>
    </div>
</div>

<div id="page-form" class="page">
    <div class="form-box">
        <h2 style="text-align:center;">บันทึกโครงงานใหม่</h2>
        <div class="sub-title">ข้อมูลพื้นฐาน</div>
        <input id="pth" placeholder="ชื่อโครงงาน">
        <input id="f1" placeholder="ชื่อผู้จัดทำ">
        <input id="t1" placeholder="ครูที่ปรึกษา">
       
        <div class="sub-title">หมวดหมู่</div>
        <select id="cat">
            <option value="">-- เลือก Theme --</option>
        </select>
       
        <div class="sub-title" style="color: var(--google-blue); font-weight: bold; margin-top: 15px;">🔗 ลิงก์ Google Drive (รูปเล่ม/ไฟล์ PDF)</div>
        <input id="driveLink" placeholder="วางลิงก์ Google Drive ที่นี่..." style="border: 2px solid var(--google-blue);">
        <p style="font-size: 11px; color: #888;">*อย่าลืมตั้งค่าใน Google Drive ให้ "ทุกคนที่มีลิงก์สามารถอ่านได้"</p>
       
        <button onclick="saveData()">💾 บันทึกข้อมูล</button>
        <button style="background:#888" onclick="show('page-choice')">ยกเลิก</button>
    </div>
</div>

<div id="page-list" class="page">
    <div class="form-box" style="max-width: 1000px;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:20px;">
            <h2 id="listTitle" style="margin:0;">โครงงาน</h2>
            <button onclick="show('page-choice')" style="width: auto; padding: 8px 20px;">กลับ</button>
        </div>
        <input id="searchInp" placeholder="🔍 ค้นหาชื่อโครงงาน..." oninput="filterProjects()">
        <div id="project-container" class="project-grid"></div>
        <button id="addBtn" onclick="addProject()" style="background:none; color:var(--primary); border:2px dashed var(--primary); margin-top:20px;">+ เพิ่มโครงงานใหม่</button>
    </div>
</div>

<script>
let currentUser = "";
let isViewerMode = false;
const THEMES = ["1. การเกษตรและการแปรรูป","2. การท่องเที่ยวคุณภาพ","3. ยานยนต์ไฟฟ้า","4. การแพทย์และสุขภาพ","5. โลจิสติกส์","6. อุปกรณ์อิเล็กทรอนิกส์อัจฉริยะ","7. SME คุณภาพสูง","8. พื้นที่และเมืองอัจฉริยะ","9. ความยากจนและการคุ้มครองทางสังคม","10. เศรษฐกิจหมุนเวียน","11. การเปลี่ยนแปลงสภาพภูมิอากาศ","12. กำลังคนสมรรถนะสูง","13. ภาครัฐที่ทันสมัย"];

window.onload = () => {
    const c = document.getElementById("cat");
    THEMES.forEach(t => c.add(new Option(t, t)));
    const last = localStorage.getItem("lastUser");
    if(last) { currentUser = last; document.getElementById("welcomeText").innerText = "สวัสดีคุณ " + last; show('page-choice'); }
};

function show(id) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

function login() {
    const u = document.getElementById("loginUser").value.trim();
    if(u) { currentUser = u; localStorage.setItem("lastUser", u); show('page-choice'); }
}

function logout() { localStorage.removeItem("lastUser"); location.reload(); }
function enterCreator() { isViewerMode = false; document.getElementById("listTitle").innerText = "โครงงานของฉัน"; document.getElementById("addBtn").style.display = "block"; filterProjects(); show('page-list'); }
function enterViewer() { isViewerMode = true; document.getElementById("listTitle").innerText = "คลังโครงงานทั้งหมด"; document.getElementById("addBtn").style.display = "none"; filterProjects(); show('page-list'); }
function addProject() { resetForm(); show('page-form'); }

function saveData() {
    const link = document.getElementById("driveLink").value.trim();
    const pth = document.getElementById("pth").value.trim();
    if(!pth || !link) return alert("กรุณากรอกชื่อโครงงานและวางลิงก์ Google Drive");
   
    const data = {
        id: Date.now(),
        owner: currentUser,
        pth: pth,
        cat: document.getElementById("cat").value,
        s1: document.getElementById("f1").value,
        t1: document.getElementById("t1").value,
        driveLink: link
    };
   
    let all = JSON.parse(localStorage.getItem("all_projects_db")) || [];
    all.push(data);
    localStorage.setItem("all_projects_db", JSON.stringify(all));
    alert("บันทึกเรียบร้อย!");
    enterCreator();
}

function filterProjects() {
    const kw = document.getElementById("searchInp").value.toLowerCase();
    const all = JSON.parse(localStorage.getItem("all_projects_db")) || [];
    const container = document.getElementById("project-container");
   
    const filtered = all.filter(p => {
        const matchKw = p.pth.toLowerCase().includes(kw);
        return isViewerMode ? matchKw : (matchKw && p.owner === currentUser);
    });

    container.innerHTML = filtered.map(p => `
        <div class="project-box">
            ${!isViewerMode ? `<button class="delete-btn" onclick="deleteProj(${p.id})">✕</button>` : ''}
            <div class="project-title">${p.pth}</div>
            <div class="tag">${p.cat || 'ทั่วไป'}</div>
            <div class="sub-title">ผู้จัดทำ: ${p.s1 || '-'}</div>
            <button class="drive-link-btn" onclick="window.open('${p.driveLink}', '_blank')">
                📂 เปิดดูไฟล์ใน Google Drive
            </button>
        </div>
    `).join('');
}

function deleteProj(id) {
    if(confirm("ลบโครงงานนี้?")) {
        let all = JSON.parse(localStorage.getItem("all_projects_db")) || [];
        localStorage.setItem("all_projects_db", JSON.stringify(all.filter(x => x.id !== id)));
        filterProjects();
    }
}

function resetForm() {
    document.querySelectorAll('#page-form input').forEach(i => i.value = '');
    document.getElementById("cat").value = "";
}
</script>
</body>
</html>
